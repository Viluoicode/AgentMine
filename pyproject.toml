[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentmine"
version = "0.1.0"
description = "Budget-aware semi-autonomous work-to-earn AI agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy", "pytest", "ruff"]

[project.scripts]
agentmine = "agentmine.bootstrap.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentmine = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/unit/application"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".tmp", "pytest-cache-files-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

